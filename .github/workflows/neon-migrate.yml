name: Neon database migration (AI, website, uploads)

# Creates the Fire Counsel AI, website-publishing and upload tables in Neon (additive and safe to re-run:
# existing tables and data are never changed or deleted).
# Run it from: Actions -> "Neon database migration (AI, website, uploads)" -> Run workflow.
# Uses the DATABASE_URL repository secret.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --omit=dev
      - name: Apply migrations 002 and 003
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm --prefix backend run db:migrate
