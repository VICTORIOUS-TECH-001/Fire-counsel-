name: Backend tests

on:
  push:
    branches: [Step-2]
    paths:
      - "backend/**"
      - "app.js"
      - "motion.js"
      - "index.html"
      - "styles.css"
      - "firebase-client.mjs"
      - "config.js"
      - "sw.js"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [Step-2]
    paths:
      - "backend/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "firebase-client.mjs"
      - "config.js"
      - "sw.js"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          cd ..
          node --check app.js
          node --check motion.js
          node --check firebase-client.mjs
          node --check config.js
          node --check sw.js
