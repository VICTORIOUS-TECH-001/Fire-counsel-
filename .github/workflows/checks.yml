name: Local regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-and-browser:
    name: Local API, study data, proxy and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            firebase/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix firebase ci
      - run: npm test
      - run: npm run test:browser
      - name: Audit frontend test and backend dependencies
        run: |
          npm audit --audit-level=moderate
          npm --prefix backend audit --audit-level=moderate
      - name: Audit Firebase development tools (known moderate warnings documented in STATUS.md)
        run: npm --prefix firebase audit --audit-level=high

  firebase-rules:
    name: Firestore and Storage rules deployment gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      GCLOUD_PROJECT: demo-fire-counsel-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix firebase ci
      # Demo project + local emulators only; no Firebase credentials or deployment.
      - run: npm --prefix firebase run test:rules
