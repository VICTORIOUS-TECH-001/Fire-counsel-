# FIRE COUNSEL — website + API on one Render Free web service (staging).
# The website calls the API on its own address (/api/...), so both are served
# by the same Express process. Secrets marked `sync: false` are typed into the
# Render dashboard when the Blueprint is created; they are never stored in Git.
services:
  - type: web
    name: fire-counsel
    runtime: node
    plan: free
    region: ohio            # same AWS region as the Neon database (us-east-2)
    # Repo root (not backend/) so the public website files are available.
    buildCommand: npm --prefix backend ci --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: SERVE_WEBSITE
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: fire-counsel
      - key: STUDENT_PROFILES_ENABLED
        value: "false"
      # Extra allowed origins (the service's own onrender.com URL is added
      # automatically from RENDER_EXTERNAL_URL).
      - key: CORS_ORIGINS
        value: http://localhost:8080
      # Paste the full Neon pooled connection string.
      - key: DATABASE_URL
        sync: false
      # Paste the Firebase Admin service-account JSON (one line). Needed for
      # sign-in-protected API routes such as the admin panel.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # --- Fire Counsel AI (keys never go in Git) ---
      # Optional Gemini writer/grounding key: https://aistudio.google.com/apikey.
      # At least one writer (Groq/Gemini/OpenRouter) is needed for answers.
      - key: GEMINI_API_KEY
        sync: false
      # Optional OpenRouter writer: https://openrouter.ai/keys.
      # Model availability, pricing and quotas depend on the account.
      - key: OPENROUTER_API_KEY
        sync: false
      # Groq writer key: https://console.groq.com/keys (not xAI/Grok).
      # This Blueprint prefers Groq; Gemini is not required for text answers.
      - key: GROQ_API_KEY
        sync: false
      # Independent search: Tavily first, Brave second, Gemini grounding last.
      # Configure at least one search key; both enable independent failover.
      # API access and quota are separate from the writer/hosting plan.
      - key: TAVILY_API_KEY
        sync: false
      # Brave Search API key (not the Brave browser):
      # https://api-dashboard.search.brave.com
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: AI_WRITER_PROVIDER_ORDER
        value: groq,gemini,openrouter
      - key: WEB_SEARCH_PROVIDER_ORDER
        value: tavily,brave,gemini
      - key: WEB_SEARCH_TIMEOUT_MS
        value: "45000"
      - key: WEB_SEARCH_PROVIDER_TIMEOUT_MS
        value: "12000"
      - key: AI_RESEARCH_CACHE_MINUTES
        value: "0"
      # Comma-separated emails that may press "Make me admin" once in the
      # Admin Studio (the email must be verified). Example: you@gmail.com
      - key: ADMIN_EMAILS
        sync: false
      # Daily allowances reset at midnight in this time zone.
      - key: AI_TIMEZONE
        value: Africa/Lagos
      # Optional model overrides: choose IDs supported by the actual account.
      #   GROQ_MODELS, GEMINI_MODELS, GEMINI_SEARCH_MODELS, OPENROUTER_MODELS
      #   GROQ_TOKENS_PER_MINUTE (conservative default 8000; verify account limit)
      #   TAVILY_SEARCH_DEPTH, TAVILY_MAX_RESULTS, BRAVE_MAX_RESULTS
      #   AI_TIMEOUT_MS, AI_MAX_CASES_PER_RUN, AI_MAX_CONCURRENT_JOBS
      # Orders set priority, not exclusion; unlisted defaults are appended and
      # providers without keys are skipped. See DEPLOYMENT.md section 5.
