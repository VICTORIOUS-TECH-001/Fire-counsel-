# FIRE COUNSEL — website + API on one Render Free web service (staging).
# The website calls the API on its own address (/api/...), so both are served
# by the same Express process. Secrets marked `sync: false` are typed into the
# Render dashboard when the Blueprint is created; they are never stored in Git.
services:
  - type: web
    name: fire-counsel
    runtime: node
    plan: free
    region: ohio            # same AWS region as the Neon database (us-east-2)
    # Repo root (not backend/) so the public website files are available.
    buildCommand: npm --prefix backend ci --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: SERVE_WEBSITE
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: fire-counsel
      - key: STUDENT_PROFILES_ENABLED
        value: "false"
      # Extra allowed origins (the service's own onrender.com URL is added
      # automatically from RENDER_EXTERNAL_URL).
      - key: CORS_ORIGINS
        value: http://localhost:8080
      # Paste the full Neon pooled connection string.
      - key: DATABASE_URL
        sync: false
      # Paste the Firebase Admin service-account JSON (one line). Needed for
      # sign-in-protected API routes such as the admin panel.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # --- Fire Counsel AI (keys never go in Git) ---
      # Google AI Studio key: https://aistudio.google.com/apikey (main AI).
      - key: GEMINI_API_KEY
        sync: false
      # OpenRouter key: https://openrouter.ai/keys (free backup models, used
      # only when Gemini is busy or out of free quota).
      - key: OPENROUTER_API_KEY
        sync: false
      # Comma-separated emails that may press "Make me admin" once in the
      # Admin Studio (the email must be verified). Example: you@gmail.com
      - key: ADMIN_EMAILS
        sync: false
      # Daily allowances reset at midnight in this time zone.
      - key: AI_TIMEZONE
        value: Africa/Lagos
      # Optional overrides (leave unset to use the built-in free-tier defaults):
      #   GEMINI_MODELS         writer models, tried in order
      #   GEMINI_SEARCH_MODELS  models with Google Search (free tier: gemini-2.5-flash-lite)
      #   OPENROUTER_MODELS     backup models (default openrouter/free)
      #   AI_TIMEOUT_MS, AI_MAX_CASES_PER_RUN, AI_MAX_CONCURRENT_JOBS
